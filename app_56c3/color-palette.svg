  <text x="40" y="120" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">Background: #0A1628</text>
  
  <rect x="120" y="40" width="60" height="60" rx="8" fill="#11223A"/>
  <text x="120" y="120" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">Surface: #11223A</text>
  
  <rect x="200" y="40" width="60" height="60" rx="8" fill="#D97706"/>
  <text x="200" y="120" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">Accent: #D97706</text>
  
  <rect x="280" y="40" width="60" height="60" rx="8" fill="#10B981"/>
