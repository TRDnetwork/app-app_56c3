<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#0A1628"/>
  
  <!-- Display font -->
  <text x="40" y="60" font-family="Playfair Display, serif" font-size="36" font-weight="700" fill="#F8F9FB">Playfair Display</text>
  <text x="40" y="90" font-family="Playfair Display, serif" font-size="24" fill="#9CA3AF">Headings & Titles</text>
  
  <!-- Body font -->
  <text x="40" y="150" font-family="Inter, sans-serif" font-size="36" font-weight="600" fill="#F8F9FB">Inter</text>
  <text x="40" y="180" font-family="Inter, sans-serif" font-size="24" fill="#9CA3AF">Body & UI Text</text>
  
  <!-- Sample text -->
  <text x="40" y="240" font-family="Inter, sans-serif" font-size="16" fill="#9CA3AF">The quick brown fox jumps over the lazy dog</text>
  <text x="40" y="270" font-family="Playfair Display, serif" font-size="16" fill="#9CA3AF">The quick brown fox jumps over the lazy dog</text>
</svg>