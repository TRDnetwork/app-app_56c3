<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="coffee-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E3A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#coffee-bg)" rx="12"/>
  
  <!-- Coffee cup -->
  <path d="M150 100 L250 100 L270 180 L130 180 Z" fill="#0A1628" stroke="#D97706" stroke-width="3"/>
  <ellipse cx="200" cy="100" rx="50" ry="10" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
  <path d="M180 80 L220 80 L225 100 L175 100 Z" fill="#D97706" opacity="0.6"/>
  
  <!-- Steam lines -->
  <path d="M200 80 Q190 60 180 40" stroke="#94A3B8" stroke-width="2" fill="none" opacity="0.5">
    <animate attributeName="d" values="M200 80 Q190 60 180 40;M200 80 Q195 50 185 30;M200 80 Q190 60 180 40" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M200 80 Q210 60 220 40" stroke="#94A3B8" stroke-width="2" fill="none" opacity="0.5">
    <animate attributeName="d" values="M200 80 Q210 60 220 40;M200 80 Q205 50 215 30;M200 80 Q210 60 220 40" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <text x="200" y="250" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">
    Coffee illustration placeholder
  </text>
</svg>