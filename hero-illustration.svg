<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628" />
      <stop offset="50%" stop-color="#0F1E3A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#hero-bg)"/>
  
  <!-- Dawn sun -->
  <circle cx="300" cy="150" r="60" fill="url(#sun-glow)"/>
  <circle cx="300" cy="150" r="40" fill="#D97706"/>
  
  <!-- Coffee beans -->
  <ellipse cx="200" cy="250" rx="25" ry="15" fill="#0A1628" transform="rotate(-30 200 250)"/>
  <ellipse cx="250" cy="280" rx="20" ry="12" fill="#1E293B" transform="rotate(15 250 280)"/>
  <ellipse cx="350" cy="260" rx="22" ry="14" fill="#0A1628" transform="rotate(-15 350 260)"/>
  <ellipse cx="400" cy="240" rx="18" ry="11" fill="#1E293B" transform="rotate(25 400 240)"/>
  
  <!-- Mountain silhouette -->
  <path d="M0 400 L150 250 L300 350 L450 200 L600 400 Z" fill="#0A1628" opacity="0.7"/>
  
  <text x="300" y="380" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" opacity="0.6">
    Dawn Brew • Karnal • Summer 2026
  </text>
</svg>