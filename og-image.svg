<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#0F1E3A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  
  <!-- Coffee cup illustration -->
  <path d="M400 300 L800 300 L850 450 L350 450 Z" fill="#1E293B" stroke="#D97706" stroke-width="3" filter="url(#glow)"/>
  <ellipse cx="600" cy="300" rx="200" ry="20" fill="#0F1E3A" stroke="#D97706" stroke-width="2"/>
  <path d="M550 250 L650 250 L660 300 L540 300 Z" fill="#D97706" opacity="0.7"/>
  
  <!-- Text -->
  <text x="600" y="200" text-anchor="middle" fill="#F8FAFC" font-family="'Playfair Display', serif" font-size="72" font-weight="700">
    Dawn Brew
  </text>
  <text x="600" y="280" text-anchor="middle" fill="#D97706" font-family="'Inter', sans-serif" font-size="36">
    Hand-Roasted Coffee in Karnal
  </text>
  <text x="600" y="550" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="28">
    Opening Summer 2026
  </text>
</svg>